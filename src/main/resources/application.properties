spring.application.name=smart-dispatch

# Strict JSON parsing for nested schemas with additionalProperties=false.
# V1 request DTOs that allow extra properties explicitly ignore them.
spring.jackson.deserialization.fail-on-unknown-properties=true

spring.datasource.url=${DB_URL:jdbc:postgresql://127.0.0.1:5432/smart_dispatch}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.flyway.enabled=true

# Public OSRM demo server. For a real deployment, run or use a managed OSRM instance.
routing.osrm.base-url=${OSRM_BASE_URL:https://router.project-osrm.org}
routing.osrm.profile=${OSRM_PROFILE:driving}
routing.osrm.connect-timeout-seconds=5
routing.osrm.read-timeout-seconds=30

server.port=${SERVER_PORT:8080}
