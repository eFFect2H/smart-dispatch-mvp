name: Docker Compose smoke test

on:
  push:
    branches: [master, "final/**"]
  pull_request:
    branches: [master]

jobs:
  docker-compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose configuration
        run: docker compose config --quiet
      - name: Build all images
        run: docker compose build
      - name: Start the application stack
        run: docker compose up -d
      - name: Verify backend, database and frontend proxy
        shell: bash
        run: |
          READY=0
          for attempt in $(seq 1 60); do
            if curl --silent --fail http://localhost:8080/api/v1/health > /tmp/health.json; then
              READY=1
              break
            fi
            sleep 2
          done
          if [ "$READY" -ne 1 ]; then
            docker compose logs
            exit 1
          fi
          curl --silent --show-error --fail http://localhost:5173/api/v1/demo | grep -q "Екатеринбург"
          curl --silent --show-error --fail http://localhost:5173/ | grep -q 'id="root"'
      - name: Stop the stack
        if: always()
        run: docker compose down -v
