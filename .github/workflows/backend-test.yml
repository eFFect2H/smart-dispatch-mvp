name: Backend tests and database smoke test

on:
  pull_request:
    paths:
      - "src/**"
      - "pom.xml"
      - ".github/workflows/backend-test.yml"
  push:
    paths:
      - "src/**"
      - "pom.xml"
      - ".github/workflows/backend-test.yml"

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: smart_dispatch
          POSTGRES_USER: smart_dispatch
          POSTGRES_PASSWORD: smart_dispatch
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U smart_dispatch -d smart_dispatch"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DB_URL: jdbc:postgresql://localhost:5432/smart_dispatch
      DB_USERNAME: smart_dispatch
      DB_PASSWORD: smart_dispatch
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Unit tests
        run: mvn -B -ntp clean test

      - name: Start backend and verify Flyway seed
        shell: bash
        run: |
          mvn -B -ntp spring-boot:run > /tmp/smart-dispatch-backend.log 2>&1 &
          APP_PID=$!
          trap 'kill "$APP_PID" 2>/dev/null || true' EXIT

          READY=0
          for attempt in $(seq 1 60); do
            if curl --silent --fail http://localhost:8080/api/v1/health > /tmp/health.json; then
              READY=1
              break
            fi
            if ! kill -0 "$APP_PID" 2>/dev/null; then
              cat /tmp/smart-dispatch-backend.log
              exit 1
            fi
            sleep 2
          done

          if [ "$READY" -ne 1 ]; then
            cat /tmp/smart-dispatch-backend.log
            exit 1
          fi

          curl --silent --show-error --fail http://localhost:8080/api/v1/demo > /tmp/demo.json
          grep -q "Екатеринбург" /tmp/demo.json
          grep -q '"orderCount":34' /tmp/demo.json

          curl --silent --show-error --fail http://localhost:8080/api/v1/reference > /tmp/reference.json
          grep -q '"service_center_id":"SC-01"' /tmp/reference.json
          grep -q '"staff_id":"ST-001"' /tmp/reference.json
